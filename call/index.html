<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Call Andreas Döbeling</title>
  <link rel="icon" href="https://raw.githubusercontent.com/DOEBELING/.github/main/assets/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #ffffff;
      --text: #22262b;
      --muted: #5b6168;
      --brand: #78022d;
      --brand-hover: #5c0122;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --text: #f0f3f6;
        --muted: #9198a1;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      text-align: center;
    }
    main { width: 100%; max-width: 420px; }
    .logo { width: 100%; max-width: 360px; height: auto; margin-bottom: 40px; }
    .logo-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .logo-light { display: none; }
      .logo-dark { display: inline; }
    }
    p { margin: 0 0 24px; color: var(--muted); }
    .call {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      border-radius: 6px;
      background: var(--brand);
      color: #fff;
      font-size: 1.25rem;
      font-weight: 600;
      text-decoration: none;
    }
    .call:hover { background: var(--brand-hover); }
    .call svg { width: 22px; height: 22px; fill: currentColor; }
    .back { display: inline-block; margin-top: 32px; color: var(--muted); font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <a href="https://Andreas.Doebeling.de">
      <img class="logo logo-light" src="https://raw.githubusercontent.com/DOEBELING/.github/main/assets/logo-light.svg" alt="DÖBELING Projektbüro">
      <img class="logo logo-dark" src="https://raw.githubusercontent.com/DOEBELING/.github/main/assets/logo-dark.svg" alt="DÖBELING Projektbüro">
    </a>
    <p>Calling Andreas Döbeling …</p>
    <a class="call" href="tel:+491721091601">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
      +49 172 1091601
    </a>
    <br>
    <a class="back" href="https://github.com/ADoebeling">← back to GitHub</a>
  </main>
  <script>
    window.location.href = "tel:+491721091601";
  </script>
</body>
</html>
